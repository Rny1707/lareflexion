    <style>
        /* --- VARIABLES DESIGN PREMIUM --- */
        :root {
            --primary: #1e4620;     /* Vert Émeraude Luxe */
            --primary-light: #2d6a31;
            --accent: #b22222;      /* Rouge brique subtil */
            --gold: #d4af37;        /* Or pour les étoiles */
            --dark: #111111;        /* Noir profond */
            --bg-light: #f9f9f9;    /* Blanc cassé / Gris très clair */
            --white: #ffffff;
            --shadow-subtle: 0 4px 20px rgba(0, 0, 0, 0.05);
            --shadow-hover: 0 10px 30px rgba(0, 0, 0, 0.08);
            --transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
            scroll-behavior: smooth;
        }

        body {
            background-color: var(--white);
            color: var(--dark);
            line-height: 1.7;
            -webkit-font-smoothing: antialiased;
        }

        a { text-decoration: none; color: inherit; transition: var(--transition); }
        ul { list-style: none; }

        /* --- HEADER ÉLÉGANT --- */
        header {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            padding: 0.8rem 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 1000;
            box-shadow: 0 1px 15px rgba(0,0,0,0.02);
        }

        .logo-img {
            height: 55px; 
            width: auto;  
            display: block;
        }

        nav ul { display: flex; gap: 30px; }
        nav ul a { font-weight: 400; font-size: 0.95rem; color: #555; }
        nav ul a:hover { color: var(--primary); }

        .menu-toggle {
            display: none;
            flex-direction: column;
            gap: 6px;
            cursor: pointer;
            background: none;
            border: none;
            padding: 5px;
            z-index: 1100;
        }

        .menu-toggle span {
            display: block;
            width: 26px;
            height: 2px;
            background-color: var(--dark);
            transition: var(--transition);
        }

        .menu-toggle.active span:nth-child(1) { transform: translateY(8px) rotate(45deg); }
        .menu-toggle.active span:nth-child(2) { opacity: 0; }
        .menu-toggle.active span:nth-child(3) { transform: translateY(-8px) rotate(-45deg); }

        /* --- HERO SECTION --- */
        .hero {
            background: linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.5)), 
                        url(Larefelexion.jpg.jpeg);
            background-size: cover;
            background-position: center;
            height: 85vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            color: var(--white);
            padding: 0 20px;
        }

        .hero h1 { 
            font-size: 2.8rem; 
            font-weight: 700;
            margin-bottom: 1.5rem; 
            max-width: 900px;
            line-height: 1.3;
            letter-spacing: -0.5px;
        }
        
        .hero p { 
            font-size: 1.2rem; 
            font-weight: 300;
            margin-bottom: 2.5rem; 
            max-width: 650px; 
            opacity: 0.9;
        }

        .btn-main {
            background: var(--primary);
            color: var(--white);
            padding: 14px 36px;
            border-radius: 4px;
            font-weight: 500;
            font-size: 0.95rem;
            letter-spacing: 0.5px;
            transition: var(--transition);
            border: 1px solid var(--primary);
        }

        .btn-main:hover { 
            background: transparent; 
            color: var(--white); 
            border-color: var(--white);
            transform: translateY(-2px); 
        }

        /* --- SECTION TITLES --- */
        .section-header {
            text-align: center;
            margin: 6rem auto 3.5rem;
            max-width: 600px;
        }

        .section-header h2 {
            font-size: 2.1rem;
            font-weight: 600;
            color: var(--dark);
            letter-spacing: -0.5px;
            margin-bottom: 10px;
        }

        .section-header::after {
            content: '';
            width: 40px;
            height: 2px;
            background: var(--primary);
            display: block;
            margin: 15px auto 0;
        }

        /* --- COMPOSANT IMAGE + TEXTE (EXPERTISE) --- */
        .expertise-container {
            display: flex;
            align-items: center;
            gap: 60px;
            padding: 2rem 5% 5rem;
            max-width: 1200px;
            margin: 0 auto;
        }

        .expertise-img-box {
            flex: 1;
            position: relative;
        }

        .expertise-img-box img {
            width: 100%;
            height: 450px;
            object-fit: cover;
            border-radius: 8px;
            box-shadow: var(--shadow-hover);
        }

        .expertise-text-box {
            flex: 1;
        }

        .expertise-text-box h3 {
            font-size: 1.8rem;
            color: var(--primary);
            margin-bottom: 1.5rem;
        }

        .expertise-text-box p {
            color: #555;
            margin-bottom: 1.5rem;
        }

        /* --- PRODUITS (GRILLE MODERNE) --- */
        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 30px;
            padding: 0 5%;
            max-width: 1200px;
            margin: 0 auto;
        }

        .product-card {
            background: var(--white);
            border-radius: 8px;
            overflow: hidden;
            transition: var(--transition);
            box-shadow: var(--shadow-subtle);
            border: 1px solid rgba(0,0,0,0.03);
            display: flex;
            flex-direction: column;
        }

        .product-card:hover { 
            transform: translateY(-6px); 
            box-shadow: var(--shadow-hover);
        }

        .product-image-container {
            width: 100%;
            height: 240px; 
            overflow: hidden; 
            background-color: var(--bg-light); 
        }

        .product-image-container img {
            width: 100%;
            height: 100%;
            object-fit: cover; 
            transition: transform 0.5s ease;
        }

        .product-card:hover .product-image-container img { transform: scale(1.06); }
